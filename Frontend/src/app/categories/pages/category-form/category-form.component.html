<div class="form-page">
  <div class="form-card">

    <h2>{{ isEdit ? 'Edit Category' : 'Add Category' }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-grid">

        <div class="form-group">
          <label for="name">
            Name <span class="required">*</span>
          </label>

          <input id="name" formControlName="name" />

          <small *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
            Name is required
          </small>

          <small *ngIf="form.get('name')?.hasError('maxlength')">
            Maximum 100 characters allowed
          </small>
        </div>

        <div class="form-group">
          <label for="parentId">Parent Category</label>

          <select id="parentId" formControlName="parentId">
            <option [ngValue]="null">No Parent</option>

            <option *ngFor="let category of categories" [ngValue]="category.id">
              {{ category.name }}
            </option>
          </select>
        </div>

        <div class="form-group full">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description"></textarea>
        </div>

      </div>

      <div class="form-actions">
        <button
          type="button"
          class="btn secondary"
          (click)="router.navigate(['/categories'])">
          Cancel
        </button>

        <button
          type="submit"
          class="btn primary"
          [disabled]="loading || form.invalid">
          {{ isEdit ? 'Update' : 'Create' }}
        </button>
      </div>

    </form>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

  </div>
</div>
