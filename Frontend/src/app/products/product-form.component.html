<div class="form-page">

  <div class="form-card">

    <h2>
      {{ isEdit ? 'Edit Product' : 'Add Product' }}
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-grid">

        <div class="form-group">
          <label>Name</label>
          <input formControlName="name" />
          <small *ngIf="form.get('name')?.touched && form.get('name')?.errors?.['required']">
            Name is required
          </small>
        </div>

        <div class="form-group">
          <label>SKU</label>
          <input formControlName="sku" />
          <small *ngIf="form.get('sku')?.touched && form.get('sku')?.errors?.['required']">
            SKU is required
          </small>
        </div>

        <div class="form-group">
          <label>Price</label>
          <input type="number" formControlName="price" />
          <small *ngIf="form.get('price')?.touched && form.get('price')?.errors?.['required']">
            Price is required
          </small>
          <small *ngIf="form.get('price')?.touched && form.get('price')?.errors?.['min']">
            Price cannot be negative
          </small>
        </div>

        <div class="form-group">
          <label>Quantity</label>
          <input type="number" formControlName="quantity" />
          <small *ngIf="form.get('quantity')?.touched && form.get('quantity')?.errors?.['required']">
            Quantity is required
          </small>
          <small *ngIf="form.get('quantity')?.touched && form.get('quantity')?.errors?.['min']">
            Quantity cannot be negative
          </small>
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea formControlName="description"></textarea>
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn secondary" (click)="cancel()">
          Cancel
        </button>

        <button type="submit" [disabled]="loading || form.invalid" class="btn primary">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
      </div>

      <div *ngIf="error" class="error">
        {{ error }}
      </div>

    </form>

  </div>

</div>
